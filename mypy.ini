# K02 shared mypy config — owned by M-CONF (coder), read-only for M-FIX.
# Target matches the project venv Python (observed 3.13.15).
[mypy]
python_version = 3.13
# Sources live under src/ (tests insert it on sys.path at runtime).
mypy_path = src
# src/ has no __init__.py files (namespace packages); without this,
# every relative and absolute intra-package import is import-not-found.
namespace_packages = True
# Unify each file to its agent_si.* module name so absolute imports
# (agent_si.backend...) and relative imports (.common) resolve to one
# module instead of "found twice under different module names".
explicit_package_bases = True
show_error_codes = True
warn_unused_ignores = True
warn_return_any = True
# M-CONF round 4 (manager ruling): interface.py `...` stub bodies are FROZEN by
# the brief (contract test references them; frozen/behaviour edits forbidden),
# so the 112 empty-body findings on that ONE module are waived here as a
# per-file exception with reason (not rule-disabling to pass).
# The 3 unused-ignore findings on that module are likewise waived: removing a
# stale type: ignore would itself edit the frozen file, so they are unremovable.
[mypy-agent_si.backend.orchestration.interface]
disable_error_code = empty-body, unused-ignore
