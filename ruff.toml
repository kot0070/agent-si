# I: stable import order. SIM/C4/RET/RUF: mechanical cleanups M-FIX
# can apply without behaviour change.
# NOT selected, with reason:
# - TRY: K02 refusal/error exception types are frozen contracts
#   (contract tests assert them); TRY004 would demand TypeError swaps.
# - BLE: lane handlers contractually return error dicts from broad
#   `except Exception`; narrowing would change behaviour.
# - PIE/PYI: interface.py carries intentional `...` stub markers
#   referenced by the frozen contract test.
# - PLR: structural refactor demands (PLR0911/0912/0913/0917: max
#   returns/branches/args) that M-FIX cannot satisfy without
#   behaviour-risky redesign; RET501 already covers useless-return.
select = ["E", "F", "UP", "B", "I", "SIM", "C4", "RET", "RUF"]

